services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRABO_DATA: /data
    volumes:
      - trabo-data:/data
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "worker.py"]
    env_file:
      - path: .env
        required: false
    environment:
      TRABO_DATA: /data
    volumes:
      - trabo-data:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "--worker"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
volumes:
  trabo-data:
